name: Delete Old Workflow Runs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'      # UTC 20:00 = 北京时间 04:00

permissions:
  actions: write
  contents: read

jobs:
  del_runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2.0.6
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 2
          keep_minimum_runs: 1
